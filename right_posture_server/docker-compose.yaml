services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: right_posture
      POSTGRES_PASSWORD: "AKBv8TlBS1gY-23pdAvzEdQ01w4aND_u"
    volumes:
      - right_posture_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "CU3xFl223kCCs82DhSNplaZTTKggleCE"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: right_posture_test
      POSTGRES_PASSWORD: "Ha8jZZLKTHC2TDeEC_D9hL3TKWg8w6PW"
    volumes:
      - right_posture_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "C7LsE7f5mBLTjy5pXCiDYpG2kB8RbFZo"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  right_posture_data:
  right_posture_test_data:
